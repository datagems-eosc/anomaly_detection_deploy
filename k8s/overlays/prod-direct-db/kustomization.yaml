# Temporary production configuration while project-sms #158 corrects MoMa.
# Source: dg-data-workflow-deployment-prod/{variables,connections}.json.
# Verified with production ds_reader: 14 NOA stations and current observations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../prod

configMapGenerator:
  - name: anomaly-detector-config
    namespace: upcite
    behavior: merge
    literals:
      # Explicitly select the existing environment-based connection path.
      - MOMA_API_URL=
      - MOMA_DATASET_ID=
      - POSTGRES_TIMESCALE_HOST=172.16.68.5
      - POSTGRES_TIMESCALE_PORT=30433

patches:
  - target: {kind: CronJob}
    patch: |-
      # Full production anomaly and health runs passed on 2026-11-21.
      - op: replace
        path: /spec/suspend
        value: false
      - op: add
        path: /metadata/annotations
        value:
          datagems.eu/database-source: dg-data-workflow-deployment-prod/connections.json
          datagems.eu/temporary-workaround: project-sms/158
