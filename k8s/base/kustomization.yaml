# Kustomization for Weather Stream Detection
# 使用: kubectl apply -k k8s/overlays/dev  或  k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: upcite

resources:
  - vault-secret.yaml
  - deployment-collector.yaml
  - cronjob-anomaly-detector.yaml
  - cronjob-health-check.yaml

# 如果需要修改镜像地址，在这里配置
# images:
#   - name: <REGISTRY>/<PROJECT>/stream-detection
#     newName: your-registry/your-project/stream-detection
#     newTag: v1.0.0

labels:
  - pairs:
      project: datagems
      team: weather-stream
    includeSelectors: false
    includeTemplates: true

# The runner wrapper and the MoMa lookup are mounted into the pods at
# /opt/datagems-runner, so they can change without rebuilding the image.
configMapGenerator:
  - name: anomaly-runner
    files:
      - runner/run_anomaly.py
      - runner/moma_connection.py
generatorOptions:
  disableNameSuffixHash: true
